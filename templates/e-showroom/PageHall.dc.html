<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div data-screen-label="Halls catalog" style="max-width:1320px;margin:0 auto;padding:clamp(24px,4cqi,56px) clamp(20px,4cqi,56px) clamp(64px,8cqi,112px);box-sizing:border-box;font-family:var(--font-arabic);color:var(--ml-ink);display:flex;flex-direction:column;gap:16px">
<dc-import name="UiBreadcrumb" trail="{{ vm.breadcrumb.trail }}" current="{{ vm.breadcrumb.current }}" hint-size="100%,20px"></dc-import>
<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:clamp(20px,3cqi,32px);margin-bottom:clamp(4px,1.5cqi,24px);border-bottom:1px solid var(--ml-ink-20)">
<div style="display:flex;flex-direction:column;gap:8px;min-width:0"><span style="font-family:var(--font-latin);font-size:13px;color:var(--ml-ochre)">{{ vm.kicker }}</span><h1 style="margin:0;font-size:clamp(28px,4cqi,48px);font-weight:500;line-height:1.25">{{ vm.title }}</h1><p style="margin:0;font-size:15px;color:var(--ml-ink-70)">{{ vm.subtitle }}</p></div>
<div role="group" aria-label="طريقة العرض" style="display:flex;padding:4px;gap:4px;border-radius:999px;background:var(--ml-ivory-shade);flex-shrink:0">
<sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ showGrid }}" aria-label="شبكة" aria-pressed="{{ isGrid }}" style="width:40px;height:36px;border-radius:999px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--ml-ink);color:var(--ml-ivory)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg></button></sc-if><sc-if value="{{ isGallery }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ showGrid }}" aria-label="شبكة" aria-pressed="{{ isGrid }}" style="width:40px;height:36px;border-radius:999px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ml-ink-70)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg></button></sc-if>
<sc-if value="{{ isGallery }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ showGallery }}" aria-label="معرض" aria-pressed="{{ isGallery }}" style="width:40px;height:36px;border-radius:999px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--ml-ink);color:var(--ml-ivory)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="8" rx="1"></rect><rect x="3" y="14" width="18" height="7" rx="1"></rect></svg></button></sc-if><sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ showGallery }}" aria-label="معرض" aria-pressed="{{ isGallery }}" style="width:40px;height:36px;border-radius:999px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ml-ink-70)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="8" rx="1"></rect><rect x="3" y="14" width="18" height="7" rx="1"></rect></svg></button></sc-if>
</div>
</div>
<div style="display:flex;gap:clamp(32px,4cqi,56px);align-items:flex-start">
<sc-if value="{{ vm.isDesktop }}" hint-placeholder-val="{{ true }}">
<aside aria-label="دليل القاعات" style="width:230px;flex-shrink:0;position:sticky;top:100px;display:flex;flex-direction:column;gap:4px">
<span style="font-family:var(--font-latin);font-size:12px;letter-spacing:.06em;color:var(--ml-ink-50);padding-bottom:10px">دليل القاعات</span>
<sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="5"><sc-if value="{{ tab.active }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ tab.select }}" aria-current="true" style="border:0;background:var(--ml-ivory-deep);padding:12px 14px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:12px;font-family:inherit;text-align:start;transition:background 140ms" style-hover="background:var(--ml-ivory-shade)"><span style="font-family:var(--font-latin);font-size:12px;color:var(--ml-ochre);width:18px">{{ tab.no }}</span><span style="flex:1;font-size:15px;color:var(--ml-ink);font-weight:500">{{ tab.label }}</span><span style="width:7px;height:7px;border-radius:50%;background:var(--ml-ochre)"></span></button></sc-if><sc-if value="{{ tab.idle }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ tab.select }}" style="border:0;background:transparent;padding:12px 14px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:12px;font-family:inherit;text-align:start;transition:background 140ms" style-hover="background:var(--ml-ivory-shade)"><span style="font-family:var(--font-latin);font-size:12px;color:var(--ml-ochre);width:18px">{{ tab.no }}</span><span style="flex:1;font-size:15px;color:var(--ml-ink-70);font-weight:400">{{ tab.label }}</span><span style="width:7px;height:7px;border-radius:50%;background:transparent"></span></button></sc-if></sc-for>
</aside>
</sc-if>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:clamp(24px,3cqi,40px)">
<sc-if value="{{ vm.notDesktop }}" hint-placeholder-val="{{ false }}">
<div role="tablist" aria-label="القاعات" style="display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * clamp(20px,4cqi,56px));padding:0 clamp(20px,4cqi,56px)">
<sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="5"><sc-if value="{{ tab.active }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ tab.select }}" aria-current="true" style="flex-shrink:0;height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--ml-ink);background:var(--ml-ink);color:var(--ml-ivory);font-family:inherit;font-size:14px;cursor:pointer;white-space:nowrap">{{ tab.label }}</button></sc-if><sc-if value="{{ tab.idle }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ tab.select }}" style="flex-shrink:0;height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--ml-ink-20);background:transparent;color:var(--ml-ink);font-family:inherit;font-size:14px;cursor:pointer;white-space:nowrap">{{ tab.label }}</button></sc-if></sc-for>
</div>
</sc-if>
<sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,22cqi,280px),1fr));gap:clamp(28px,3cqi,40px) clamp(14px,2cqi,24px)">
<sc-for list="{{ vm.items }}" as="piece" hint-placeholder-count="4"><dc-import name="PieceCard" p="{{ piece }}" variant="overlay" n="{{ $index }}" hint-size="100%,380px"></dc-import></sc-for>
<div style="aspect-ratio:3/4;border-radius:999px 999px 0 0;background:var(--ml-ivory-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20% 14% 10%;box-sizing:border-box;text-align:center;min-width:0">
<x-import component-from-global-scope="MagicLookDesignSystem_1440af.LogoMark" size="{{ 30 }}" hint-size="40px,30px"></x-import>
<span style="font-size:clamp(14px,1.4cqi,17px);font-weight:500;line-height:1.6">{{ vm.fullRange.title }}</span>
<span style="font-size:13px;line-height:1.7;color:var(--ml-ink-70)">{{ vm.fullRange.text }}</span>
<a href="{{ vm.fullRange.link }}" target="_blank" rel="noopener" style="font-size:14px;color:var(--ml-ochre);display:flex;align-items:center;gap:6px">واتساب<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
</div>
</div>
</sc-if>
<sc-if value="{{ isGallery }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column">
<sc-for list="{{ vm.items }}" as="piece" hint-placeholder-count="3">
<article style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(20px,4cqi,56px);align-items:center;padding:clamp(24px,3cqi,40px) 0;border-bottom:1px solid var(--ml-ink-20)">
<div onClick="{{ piece.open }}" style="aspect-ratio:4/5;max-width:440px;width:100%;border-radius:999px 999px 0 0;overflow:hidden;background:var(--ml-ivory-deep);cursor:pointer"><img src="{{ piece.cover }}" alt="{{ piece.name }}" style="width:100%;height:100%;object-fit:cover;display:block;transition:transform 480ms cubic-bezier(.22,.61,.36,1)" style-hover="transform:scale(1.03)"></div>
<div style="display:flex;flex-direction:column;gap:16px">
<span style="font-family:var(--font-latin);font-size:13px;color:var(--ml-ochre)">{{ piece.hallLabel }}</span>
<h2 style="margin:0;font-size:clamp(24px,3cqi,34px);font-weight:500;line-height:1.3">{{ piece.name }}</h2>
<div style="width:48px;height:2px;background:var(--ml-ochre)"></div>
<p style="margin:0;font-size:16px;line-height:1.8;color:var(--ml-ink-70);text-wrap:pretty">{{ piece.lead }}</p>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:14px"><sc-for list="{{ piece.features }}" as="feature" hint-placeholder-count="3"><sc-if value="{{ feature.separated }}" hint-placeholder-val="{{ false }}"><span style="width:6px;height:6px;border-radius:50%;background:var(--ml-ochre)"></span></sc-if><span>{{ feature.text }}</span></sc-for></div>
<div style="display:flex;flex-wrap:wrap;gap:12px;padding-top:8px"><x-import component-from-global-scope="MagicLookDesignSystem_1440af.Button" variant="secondary" onClick="{{ piece.open }}" hint-size="130px,44px">عرض القطعة</x-import><x-import component-from-global-scope="MagicLookDesignSystem_1440af.Button" variant="ghost" onClick="{{ piece.toggleSaved }}" hint-size="190px,44px">{{ piece.saveText }}</x-import></div>
</div>
</article>
</sc-for>
<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-top:clamp(24px,3cqi,40px);padding:clamp(20px,3cqi,32px);border-radius:24px;background:var(--ml-ivory-deep)">
<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:17px;font-weight:500">{{ vm.fullRange.title }}</span><span style="font-size:14px;color:var(--ml-ink-70)">{{ vm.fullRange.text }}</span></div>
<a href="{{ vm.fullRange.link }}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--ml-ink);color:var(--ml-ink);font-size:15px;text-decoration:none">واتساب</a>
</div>
</div>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const VIEW = { GRID: 'grid', GALLERY: 'gallery' };

class Component extends DCLogic {
  state = { view: VIEW.GRID };

  renderVals() {
    const isGrid = this.state.view === VIEW.GRID;
    const tabs = (this.props.vm && this.props.vm.tabs) || [];
    return {
      isGrid,
      isGallery: !isGrid,
      showGrid: () => this.setState({ view: VIEW.GRID }),
      showGallery: () => this.setState({ view: VIEW.GALLERY }),
      tabs: tabs.map(tab => ({ ...tab, idle: !tab.active }))
    };
  }
}
</script>
</body>
</html>
