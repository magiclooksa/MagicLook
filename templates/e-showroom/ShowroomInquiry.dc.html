<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div data-screen-label="Inquiry list" role="dialog" aria-label="قائمة الاستفسار" style="position:absolute;top:0;left:0;right:0;bottom:0;font-family:var(--font-arabic);color:var(--ml-ink)">
<div data-anim="scrim" onClick="{{ close }}" style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(23,25,27,.45)"></div>
<div data-anim="panel-drawer" style="position:absolute;left:0;bottom:0;width:max(min(440px, 100%), min(100%, calc((640px - 100cqi) * 999)));top:min(14%, max(0px, calc((640px - 100cqi) * 999)));border-radius:min(24px, max(0px, calc((640px - 100cqi) * 999))) min(24px, max(0px, calc((640px - 100cqi) * 999))) 0 0;background:var(--ml-ivory);display:flex;flex-direction:column;box-shadow:var(--shadow-soft);overflow:hidden">
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}"><div style="display:flex;justify-content:center;padding-top:10px"><span style="width:40px;height:4px;border-radius:999px;background:var(--ml-ink-20)"></span></div></sc-if>
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px 16px;border-bottom:1px solid var(--ml-ink-20)">
<div style="display:flex;align-items:baseline;gap:10px"><h2 style="margin:0;font-size:22px;font-weight:500">قائمة الاستفسار</h2><span style="font-family:var(--font-latin);font-size:14px;color:var(--ml-ochre)">{{ count }}</span></div>
<button type="button" onClick="{{ close }}" aria-label="إغلاق" style="width:44px;height:44px;margin-inline-end:-10px;border:0;border-radius:999px;background:none;color:var(--ml-ink);cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
<sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
<div style="flex:1;overflow-y:auto;padding:8px 24px">
<p style="margin:12px 0 4px;font-size:14px;line-height:1.7;color:var(--ml-ink-70)">اجمع القطع التي تهمك وأرسلها دفعة واحدة عبر واتساب.</p>
<sc-for list="{{ items }}" as="it" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--ml-ink-20)">
<button type="button" onClick="{{ it.open }}" aria-label="{{ it.name }}" style="width:64px;height:80px;flex-shrink:0;padding:0;border:0;border-radius:999px 999px 4px 4px;overflow:hidden;background:var(--ml-ivory-deep);cursor:pointer"><img src="{{ it.cover }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></button>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-family:var(--font-latin);font-size:12px;color:var(--ml-ochre)">{{ it.hallName }}</span><span style="font-size:16px;font-weight:500;line-height:1.5">{{ it.name }}</span></div>
<button type="button" onClick="{{ it.remove }}" style="border:0;background:none;padding:10px 0;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ml-ink-50)">إزالة</button>
</div>
</sc-for>
</div>
<div style="padding:16px 24px 24px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--ml-ink-20);background:var(--ml-ivory)">
<x-import component-from-global-scope="MagicLookDesignSystem_1440af.Button" size="lg" full-width="{{ true }}" onClick="{{ sendWa }}" hint-size="100%,56px">إرسال عبر واتساب</x-import>
<x-import component-from-global-scope="MagicLookDesignSystem_1440af.Button" variant="secondary" full-width="{{ true }}" onClick="{{ openVisit }}" hint-size="100%,44px">احجز زيارة لمعاينتها</x-import>
</div>
</sc-if>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:48px 32px;text-align:center">
<x-import component-from-global-scope="MagicLookDesignSystem_1440af.LogoMark" size="{{ 36 }}" hint-size="48px,36px"></x-import>
<span style="font-size:18px;font-weight:500">القائمة فارغة</span>
<span style="font-size:14px;line-height:1.7;color:var(--ml-ink-70);max-width:280px">احفظ القطع التي تعجبك من القاعات لتجمعها هنا وترسلها في رسالة واحدة.</span>
<div style="padding-top:8px"><x-import component-from-global-scope="MagicLookDesignSystem_1440af.Button" variant="secondary" onClick="{{ goHalls }}" hint-size="170px,44px">تجوّل في القاعات</x-import></div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
