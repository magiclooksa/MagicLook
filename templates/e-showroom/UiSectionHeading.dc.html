<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;font-family:var(--font-arabic)">
<div style="display:flex;flex-direction:column;gap:10px;max-width:760px;min-width:0">
<sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><span style="font-family:var(--font-latin);font-size:13px;color:var(--ml-ochre)">{{ kicker }}</span></sc-if><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><span style="font-family:var(--font-latin);font-size:13px;color:var(--ml-ochre-300)">{{ kicker }}</span></sc-if>
<h2 style="margin:0;font-size:clamp(26px,3.4cqi,40px);font-weight:500;line-height:1.3;text-wrap:balance">{{ title }}</h2>
<sc-if value="{{ hasLead }}" hint-placeholder-val="{{ false }}"><sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><p style="margin:0;font-size:16px;line-height:1.8;color:var(--ml-ink-70);text-wrap:pretty">{{ lead }}</p></sc-if><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:16px;line-height:1.8;color:var(--ml-ivory-shade);text-wrap:pretty">{{ lead }}</p></sc-if></sc-if>
</div>
<sc-if value="{{ hasAction }}" hint-placeholder-val="{{ false }}"><sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ onAction }}" style="border:0;background:none;padding:8px 0;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ml-ochre);display:flex;align-items:center;gap:6px;white-space:nowrap">{{ actionLabel }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></button></sc-if><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ onAction }}" style="border:0;background:none;padding:8px 0;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ml-ochre-300);display:flex;align-items:center;gap:6px;white-space:nowrap">{{ actionLabel }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></button></sc-if></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:160},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;القاعات&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;تجوّل بين القاعات&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;},&quot;actionLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const { tone, lead, actionLabel, onAction } = this.props;
    const isDark = tone === 'dark';
    return {
      isDark,
      isLight: !isDark,
      hasLead: Boolean(lead),
      hasAction: Boolean(actionLabel && onAction)
    };
  }
}
</script>
</body>
</html>
