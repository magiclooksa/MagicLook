<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<nav aria-label="مسار التنقل" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--font-arabic);font-size:13px;color:var(--ml-ink-50)">
<sc-for list="{{ trail }}" as="crumb" hint-placeholder-count="1"><button type="button" onClick="{{ crumb.select }}" style="border:0;background:none;padding:0;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ml-ink-70)">{{ crumb.label }}</button><span aria-hidden="true">/</span></sc-for>
<span aria-current="page" style="color:var(--ml-ink)">{{ current }}</span>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:40},&quot;trail&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ label: string; select: () =&gt; void }[]&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;من نحن&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
