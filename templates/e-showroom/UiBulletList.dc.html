<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><ul style="margin:0;padding:0;padding-inline-start:18px;list-style:disc;color:var(--ml-ochre);display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px 28px;font-family:var(--font-arabic);font-size:15px;line-height:1.7">
<sc-for list="{{ items }}" as="item" hint-placeholder-count="4"><li><span style="color:var(--ml-ink)">{{ item }}</span></li></sc-for>
</ul></sc-if><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><ul style="margin:0;padding:0;padding-inline-start:18px;list-style:disc;color:var(--ml-ochre-300);display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px 28px;font-family:var(--font-arabic);font-size:15px;line-height:1.7">
<sc-for list="{{ items }}" as="item" hint-placeholder-count="4"><li><span style="color:var(--ml-ivory)">{{ item }}</span></li></sc-for>
</ul></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:140},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[&quot;الجودة&quot;,&quot;الراحة&quot;,&quot;التناسق البصري&quot;],&quot;tsType&quot;:&quot;string[]&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const isDark = this.props.tone === 'dark';
    return { isDark, isLight: !isDark };
  }
}
</script>
</body>
</html>
