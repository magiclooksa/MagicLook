        open: () => this.go({ s: 'piece', id: p.id }),
        toggle: e => { if (e && e.stopPropagation) e.stopPropagation(); this.toggle(p.id); },
        remove: () => this.toggle(p.id) };
    });
    const activeHall = isHall && r.hall !== 'all' ? hallById[r.hall] : null;
    const hallTabs = [{ id: 'all', no: '—', label: 'كل القطع' }].concat(SR_HALLS.map(h => ({ id: h.id, no: h.no, label: h.name }))).map(t => {
      const on = (r.hall || 'all') === t.id;
      return { ...t, on, off: !on,
        open: () => this.go({ s: 'hall', hall: t.id }) };
    });
    const piece = isPiece ? pieces.find(p => p.id === r.id) : null;
    const inquiry = s.list.map(id => pieces.find(p => p.id === id)).filter(Boolean);
    const waLink = SR_WA + '?text=' + enc('مرحباً، أود الاستفسار عن قطع معرض النظرة الساحرة.');
    const pieceWa = piece ? SR_WA + '?text=' + enc('مرحباً، أود الاستفسار عن: ' + piece.name) : waLink;
    const heroPhoto = (pr.heroStyle || 'photo') === 'photo';
    const cal = pr.useCalligraphy !== false;
    return {
      frameRef: this.frameRef, scrollRef: this.scrollRef, outerRef: this.outerRef,
      isMobile, notMobile: !isMobile, isDesktop, notDesktop: !isDesktop,
      isHome, isHall, isPiece, notHome: !isHome, notHall: !isHall,
      heroPhoto, heroPattern: !heroPhoto, cal, noCal: !cal, cardStyle: pr.cardStyle || 'arch',
      halls: SR_HALLS.map(h => ({ ...h, open: () => this.go({ s: 'hall', hall: h.id }) })),
      pieces,
      hallTabs, hallItems: activeHall ? pieces.filter(p => p.hall === activeHall.id) : pieces,
      hallKicker: activeHall ? 'القاعة ' + activeHall.no : 'القاعات',
      hallTitle: activeHall ? activeHall.name : 'كل القطع',
      hallSubtitle: activeHall ? activeHall.line : 'مختارات من قاعات المعرض الأربع',
      piece, related: piece ? pieces.filter(p => p.id !== piece.id).slice(0, 3) : [],
      pieceSaveText: piece ? piece.saveText : '', pieceIconFill: piece ? piece.iconFill : 'none', pieceIconStroke: piece ? piece.iconStroke : 'currentColor',
      togglePiece: () => piece && this.toggle(piece.id),
      goPieceHall: () => this.go({ s: 'hall', hall: piece ? piece.hall : 'all' }),
      inquiry, count: inquiry.length, hasInquiry: inquiry.length > 0, noInquiry: inquiry.length === 0,
      waBase: SR_WA, waLink, pieceWa,
      openPieceWa: () => window.open(pieceWa, '_blank', 'noopener'),
      sendListWa: () => window.open(SR_WA + '?text=' + enc('مرحباً، أود الاستفسار عن القطع التالية:\n' + inquiry.map(p => '• ' + p.name).join('\n')), '_blank', 'noopener'),
      openMaps: () => window.open('https://www.google.com/maps/search/?api=1&query=' + enc('الدمام حي المنار شارع ابوبكر الصديق'), '_blank', 'noopener'),
      goHome: () => this.go({ s: 'home' }),
      goHalls: () => this.go({ s: 'hall', hall: 'all' }),
      goBack: () => this.go({ s: 'hall', hall: piece ? piece.hall : 'all' }),
      openChair: () => this.go({ s: 'piece', id: 'velvet-armchair' }),
      openInquiry: () => this.setState({ drawer: true, visit: false }),
      openVisit: () => this.setState({ visit: true, drawer: false }),
      closeOverlays: () => this.setState({ drawer: false, visit: false }),
      drawerOpen: s.drawer, visitOpen: s.visit,
      showTabBar: isMobile && !isPiece, showPieceBar: isMobile && !!piece
    };
  }
}
</script>
</body>
</html>
