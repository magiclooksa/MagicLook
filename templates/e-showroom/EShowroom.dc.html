<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="E-showroom" description="Magic Look website — responsive and adaptive: home, about, solutions, work process, halls catalog, piece detail with hotspots, inquiry list, visit booking and nav menu" -->
<helmet><script src="./ds-base.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script><script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script><style>html,body{margin:0;height:100%;background:#E9E2D5}</style></helmet>
<div ref="{{ outerRef }}" style="height:100vh;height:100dvh;box-sizing:border-box;display:flex;align-items:center;justify-content:center">
<div ref="{{ frameRef }}" dir="rtl" lang="ar" style="position:relative;width:100%;height:100%;overflow:hidden;container-type:inline-size;background:var(--ml-ivory);color:var(--ml-ink);font-family:var(--font-arabic)">
<div ref="{{ scrollRef }}" style="position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden">
<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
<dc-import name="LayoutHeader" style="position:sticky;top:0;z-index:20" hint-size="100%,76px" vm="{{ vm.header }}"></dc-import>
<main>
<sc-if value="{{ vm.page.isHome }}" hint-placeholder-val="{{ false }}"><dc-import name="PageHome" hint-size="100%,2600px" vm="{{ vm.home }}"></dc-import></sc-if>
<sc-if value="{{ vm.page.isAbout }}" hint-placeholder-val="{{ false }}"><dc-import name="PageAbout" hint-size="100%,3200px" vm="{{ vm.about }}"></dc-import></sc-if>
<sc-if value="{{ vm.page.isSolutions }}" hint-placeholder-val="{{ false }}"><dc-import name="PageSolutions" hint-size="100%,4200px" vm="{{ vm.solutions }}"></dc-import></sc-if>
<sc-if value="{{ vm.page.isProcess }}" hint-placeholder-val="{{ false }}"><dc-import name="PageProcess" hint-size="100%,2600px" vm="{{ vm.process }}"></dc-import></sc-if>
<sc-if value="{{ vm.page.isHall }}" hint-placeholder-val="{{ false }}"><dc-import name="PageHall" hint-size="100%,1400px" vm="{{ vm.hall }}"></dc-import></sc-if>
<sc-if value="{{ vm.page.isPiece }}" hint-placeholder-val="{{ false }}"><dc-import name="PagePiece" hint-size="100%,2000px" vm="{{ vm.piece }}"></dc-import></sc-if>
</main>
<dc-import name="LayoutFooter" hint-size="100%,440px" vm="{{ vm.footer }}"></dc-import>
<sc-if value="{{ vm.viewport.isMobile }}" hint-placeholder-val="{{ false }}"><div style="height:84px"></div></sc-if>
</sc-if>
</div>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
<sc-if value="{{ vm.tabBar.visible }}" hint-placeholder-val="{{ false }}"><dc-import name="LayoutTabBar" style="position:absolute;left:0;right:0;bottom:0;z-index:30" hint-size="100%,68px" vm="{{ vm.tabBar }}"></dc-import></sc-if>
<sc-if value="{{ vm.pieceBar.visible }}" hint-placeholder-val="{{ false }}"><dc-import name="LayoutPieceBar" style="position:absolute;left:0;right:0;bottom:0;z-index:30" hint-size="100%,80px" vm="{{ vm.pieceBar }}"></dc-import></sc-if>
<sc-if value="{{ vm.overlay.inquiry }}" hint-placeholder-val="{{ false }}"><dc-import name="OverlayInquiry" style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:60" hint-size="100%,100%" vm="{{ vm.inquiry }}"></dc-import></sc-if>
<sc-if value="{{ vm.overlay.menu }}" hint-placeholder-val="{{ false }}"><dc-import name="OverlayMenu" style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:65" hint-size="100%,100%" vm="{{ vm.menu }}"></dc-import></sc-if>
<sc-if value="{{ vm.overlay.visit }}" hint-placeholder-val="{{ false }}"><dc-import name="OverlayVisit" style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:70" hint-size="100%,100%" vm="{{ vm.visit }}"></dc-import></sc-if>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;motion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;expressive&quot;,&quot;subtle&quot;,&quot;off&quot;],&quot;default&quot;:&quot;expressive&quot;,&quot;tsType&quot;:&quot;'expressive' | 'subtle' | 'off'&quot;,&quot;section&quot;:&quot;Showroom&quot;},&quot;heroStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;photo&quot;,&quot;pattern&quot;],&quot;default&quot;:&quot;photo&quot;,&quot;tsType&quot;:&quot;'photo' | 'pattern'&quot;,&quot;section&quot;:&quot;Showroom&quot;},&quot;useCalligraphy&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Showroom&quot;},&quot;previewDevice&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;desktop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto' | 'desktop' | 'tablet' | 'mobile'&quot;,&quot;section&quot;:&quot;Preview&quot;}}">
// Composition root: loads the application + infrastructure layers, wires browser adapters into the
// application's ports, and hands one presenter-built view model per screen region to the view components.
const MODULE_PATHS = { application: './application/index.js', infrastructure: './infrastructure/index.js' };
const STORAGE_KEY = 'ml-showroom-inquiry';
const DEFAULT_MOTION = 'expressive';
const DEFAULT_DEVICE = 'auto';

const loadModule = path => import(new URL(path, document.baseURI).href);

class Component extends DCLogic {
  state = { route: null, savedIds: [], overlay: null, width: 0 };
  outerRef = React.createRef();
  frameRef = React.createRef();
  scrollRef = React.createRef();
  disposers = [];

  async componentDidMount() {
    const [application, infrastructure] = await Promise.all([loadModule(MODULE_PATHS.application), loadModule(MODULE_PATHS.infrastructure)]);
    if (this.unmounted) return;
    this.infra = infrastructure;
    this.app = application.createShowroomApp({ storage: infrastructure.createLocalStorage(STORAGE_KEY) });
    this.history = infrastructure.createHashHistory(hash => this.showRoute(this.app.parseHash(hash)));
    this.actions = this.createActions();
    const frame = this.frameRef.current;
    this.disposers.push(
      () => this.history.dispose(),
      infrastructure.observeWidth(frame, width => this.setState({ width })),
      infrastructure.onEscape(this.actions.closeOverlays)
    );
    this.applyDeviceFrame();
    const width = (frame && frame.clientWidth) || window.innerWidth;
    this.setState({ ...this.app.initialState(this.history.current()), width }, () => this.startMotion());
  }

  componentDidUpdate(prev) {
    if (!this.infra) return;
    if (prev.previewDevice !== this.props.previewDevice) this.applyDeviceFrame();
    if (prev.motion !== this.props.motion) this.startMotion();
  }

  componentWillUnmount() {
    this.unmounted = true;
    this.stopMotion();
    this.disposers.forEach(dispose => dispose());
  }

  createActions() {
    return {
      navigate: route => this.navigate(route),
      openOverlay: overlay => this.setState({ overlay }),
      closeOverlays: () => this.setState({ overlay: null }),
      toggleSaved: id => this.setState(state => ({ savedIds: this.app.toggleSaved(state.savedIds, id) })),
      openExternal: this.infra.openExternal
    };
  }

  navigate(route) {
    this.history.push(this.app.toHash(route));
    this.showRoute(route);
  }

  showRoute(route) {
    this.setState({ route, overlay: null }, () => {
      if (!this.motion) return;
      this.motion.toTop();
      this.motion.routeChanged();
    });
  }

  applyDeviceFrame() {
    this.infra.applyDeviceFrame(this.outerRef.current, this.frameRef.current, this.props.previewDevice || DEFAULT_DEVICE);
  }

  startMotion() {
    this.stopMotion();
    this.motion = this.infra.startMotion({ frame: this.frameRef.current, scroller: this.scrollRef.current, mode: this.props.motion || DEFAULT_MOTION });
  }

  stopMotion() {
    if (this.motion) this.motion.destroy();
    this.motion = null;
  }

  presentationOptions() {
    return { heroStyle: this.props.heroStyle || 'photo', useCalligraphy: this.props.useCalligraphy !== false };
  }

  renderVals() {
    const refs = { outerRef: this.outerRef, frameRef: this.frameRef, scrollRef: this.scrollRef };
    if (!this.app || !this.state.route) return { ...refs, ready: false, vm: {} };
    const vm = this.app.present({ ...this.state, options: this.presentationOptions() }, this.actions);
    return { ...refs, ready: true, vm };
  }
}
</script>
</body>
</html>
