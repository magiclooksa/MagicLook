<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div data-screen-label="Process" style="font-family:var(--font-arabic);color:var(--ml-ink)">
<section style="max-width:1320px;margin:0 auto;padding:clamp(24px,4cqi,56px) clamp(20px,4cqi,56px) 0;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">
<dc-import name="UiBreadcrumb" trail="{{ vm.breadcrumb.trail }}" current="{{ vm.breadcrumb.current }}" hint-size="100%,20px"></dc-import>
<div style="display:flex;flex-direction:column;gap:14px;max-width:760px;padding-bottom:clamp(28px,4cqi,48px)">
<span style="font-family:var(--font-latin);font-size:13px;color:var(--ml-ochre)">{{ vm.hero.kicker }}</span>
<h1 style="margin:0;font-size:clamp(32px,5cqi,56px);font-weight:500;line-height:1.3;text-wrap:balance">{{ vm.hero.title }}</h1>
<p style="margin:0;font-size:clamp(16px,1.5cqi,18px);line-height:1.8;color:var(--ml-ink-70)">{{ vm.hero.lead }}</p>
</div>
</section>
<section data-screen-label="Steps" style="max-width:1320px;margin:0 auto;padding:0 clamp(20px,4cqi,56px);box-sizing:border-box;display:flex;flex-direction:column">
<sc-for list="{{ vm.phases }}" as="phase" hint-placeholder-count="4">
<div data-anim="rise" style="display:flex;flex-wrap:wrap;gap:8px clamp(24px,4cqi,64px);padding:clamp(28px,4cqi,48px) 0;border-top:1px solid var(--ml-ink-20)">
<div style="flex:1 1 240px;display:flex;flex-direction:column;gap:6px;padding-top:16px"><span style="font-family:var(--font-latin);font-size:13px;color:var(--ml-ochre)">{{ phase.no }}</span><h2 style="margin:0;font-size:clamp(22px,2.4cqi,28px);font-weight:500;line-height:1.4">{{ phase.title }}</h2></div>
<ol style="flex:3 1 420px;margin:0;padding:0;list-style:none;display:flex;flex-direction:column">
<sc-for list="{{ phase.steps }}" as="step" hint-placeholder-count="4"><li style="display:flex;align-items:baseline;gap:20px;padding:16px 0;border-bottom:1px solid var(--ml-ivory-shade)"><span style="font-family:var(--font-latin);font-weight:700;font-size:15px;color:var(--ml-ochre);min-width:28px">{{ step.no }}</span><span style="font-size:clamp(17px,1.6cqi,20px)">{{ step.text }}</span></li></sc-for>
</ol>
</div>
</sc-for>
</section>
<section data-screen-label="Clients" style="margin-top:clamp(56px,8cqi,112px);background:var(--ml-ink);color:var(--ml-ivory);position:relative;overflow:hidden">
<div style="position:absolute;top:0;left:0;right:0;bottom:0;background-image:url(../../assets/pattern/pattern-tile-ivory.svg);background-size:240px 240px;opacity:.10"></div>
<div style="position:relative;max-width:1320px;margin:0 auto;padding:clamp(56px,8cqi,112px) clamp(20px,4cqi,56px);box-sizing:border-box;display:flex;flex-direction:column;gap:clamp(32px,4cqi,56px)">
<dc-import name="UiSectionHeading" kicker="{{ vm.clients.kicker }}" title="{{ vm.clients.title }}" tone="dark" hint-size="100%,90px"></dc-import>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:clamp(32px,4cqi,56px)">
<sc-for list="{{ vm.clients.groups }}" as="group" hint-placeholder-count="3"><div data-anim="card" style="display:flex;flex-direction:column;gap:16px;padding-top:20px;border-top:2px solid var(--ml-ochre-300)"><h3 style="margin:0;font-size:22px;font-weight:500">{{ group.title }}</h3><dc-import name="UiBulletList" items="{{ group.members }}" tone="dark" hint-size="100%,140px"></dc-import></div></sc-for>
</div>
</div>
</section>
<section data-screen-label="Process CTA" style="max-width:1320px;margin:0 auto;padding:clamp(72px,10cqi,140px) clamp(20px,4cqi,56px);box-sizing:border-box">
<div style="background:var(--ml-ivory-deep);border-radius:clamp(24px,3cqi,40px);padding:clamp(32px,6cqi,80px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px 48px">
<div style="display:flex;flex-direction:column;gap:12px;max-width:560px"><span style="font-family:var(--font-latin);font-size:13px;color:var(--ml-ochre)">{{ vm.cta.kicker }}</span><h2 style="margin:0;font-size:clamp(26px,3.4cqi,40px);font-weight:500;line-height:1.3">{{ vm.cta.title }}</h2><p style="margin:0;font-size:16px;line-height:1.8;color:var(--ml-ink-70)">{{ vm.cta.lead }}</p></div>
<div style="display:flex;flex-wrap:wrap;gap:12px"><x-import component-from-global-scope="MagicLookDesignSystem_1440af.Button" size="lg" onClick="{{ vm.openWhatsApp }}" hint-size="180px,56px">تواصل عبر واتساب</x-import><x-import component-from-global-scope="MagicLookDesignSystem_1440af.Button" variant="secondary" size="lg" onClick="{{ vm.openVisit }}" hint-size="150px,56px">احجز زيارة</x-import></div>
</div>
</section>
</div>
</x-dc>
</body>
</html>
