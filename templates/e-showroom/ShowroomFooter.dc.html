<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<footer data-screen-label="Footer" style="background:var(--ml-ink);color:var(--ml-ivory);font-family:var(--font-arabic);position:relative;overflow:hidden">
<div style="position:absolute;top:0;left:0;right:0;bottom:0;background-image:url(../../assets/pattern/pattern-tile-ivory.svg);background-size:240px 240px;opacity:.06"></div>
<div style="position:relative;max-width:1320px;margin:0 auto;padding:clamp(48px,6cqi,88px) clamp(20px,4cqi,56px);box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:clamp(32px,4cqi,48px)">
<div style="display:flex;flex-direction:column;gap:20px;align-items:flex-start">
<x-import component-from-global-scope="MagicLookDesignSystem_1440af.Logo" tone="dark" size="{{ 44 }}" hint-size="210px,44px"></x-import>
<p style="margin:0;font-size:15px;line-height:1.8;color:var(--ml-ivory-shade)">أناقة تسكن تفاصيلك.</p>
</div>
<nav style="display:flex;flex-direction:column;gap:12px">
<span style="font-family:var(--font-latin);font-size:12px;letter-spacing:.06em;color:var(--ml-ochre-300);padding-bottom:4px">المعرض</span>
<button type="button" onClick="{{ goHome }}" style="border:0;background:none;padding:0;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ml-ivory);text-align:start">الرئيسية</button>
<button type="button" onClick="{{ goHalls }}" style="border:0;background:none;padding:0;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ml-ivory);text-align:start">كل القطع</button>
<button type="button" onClick="{{ openVisit }}" style="border:0;background:none;padding:0;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ml-ivory);text-align:start">احجز زيارة</button>
</nav>
<nav style="display:flex;flex-direction:column;gap:12px">
<span style="font-family:var(--font-latin);font-size:12px;letter-spacing:.06em;color:var(--ml-ochre-300);padding-bottom:4px">القاعات</span>
<sc-for list="{{ halls }}" as="h" hint-placeholder-count="4"><button type="button" onClick="{{ h.open }}" style="border:0;background:none;padding:0;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ml-ivory);text-align:start">{{ h.name }}</button></sc-for>
</nav>
<div style="display:flex;flex-direction:column;gap:12px">
<span style="font-family:var(--font-latin);font-size:12px;letter-spacing:.06em;color:var(--ml-ochre-300);padding-bottom:4px">تواصل</span>
<a href="{{ waLink }}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ml-ivory);text-decoration:none"><x-import component-from-global-scope="MagicLookDesignSystem_1440af.SocialIcon" name="whatsapp" size="{{ 18 }}" color="var(--ml-ivory)" hint-size="18px,18px"></x-import>واتساب</a>
<button type="button" onClick="{{ openMaps }}" style="border:0;background:none;padding:0;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ml-ivory);text-align:start">الموقع على الخريطة</button>
<span dir="ltr" style="font-family:var(--font-latin);font-weight:700;font-size:15px;letter-spacing:.02em;text-align:end">05 10 65 73 89</span>
<span dir="ltr" style="font-family:var(--font-latin);font-weight:700;font-size:15px;letter-spacing:.02em;text-align:end">05 35 34 65 55</span>
</div>
</div>
<div style="position:relative;background:var(--ml-ochre);color:var(--ml-ivory)">
<div style="max-width:1320px;margin:0 auto;padding:16px clamp(20px,4cqi,56px);box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px">
<span style="font-size:14px;font-weight:500">الدمام - حي المنار - شارع ابوبكر الصديق - امام بنك الراجحي</span>
<div dir="ltr"><x-import component-from-global-scope="MagicLookDesignSystem_1440af.SocialLinks" layout="inline" size="{{ 18 }}" color="var(--ml-ivory)" hint-size="260px,20px"></x-import></div>
</div>
</div>
</footer>
</x-dc>
</body>
</html>
