<sc-if value="{{ image.idle }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ image.select }}" aria-label="صورة {{ image.no }}" aria-pressed="false" style="padding:0;border:2px solid transparent;border-radius:999px 999px 6px 6px;overflow:hidden;aspect-ratio:4/5;background:var(--ml-ivory-deep);cursor:pointer;transition:border-color 140ms" style-hover="border-color:var(--ml-ochre-300)"><sc-if value="{{ image.cutout }}" hint-placeholder-val="{{ false }}"><img src="{{ image.src }}" alt="" style="width:100%;height:100%;display:block;object-fit:contain;mix-blend-mode:multiply"></sc-if><sc-if value="{{ image.photo }}" hint-placeholder-val="{{ true }}"><img src="{{ image.src }}" alt="" style="width:100%;height:100%;display:block;object-fit:cover"></sc-if></button></sc-if>

<div style="flex:1;min-width:0;position:relative;aspect-ratio:4/5;border-radius:999px 999px 0 0;overflow:hidden;background:var(--ml-ivory-deep)">

</div>
</div>
</sc-if>
<sc-if value="{{ vm.isMobile }}" hint-placeholder-val="{{ false }}">
<div ref="{{ stripRef }}" onScroll="{{ onStripScroll }}" style="display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px">
<sc-for list="{{ images }}" as="image" hint-placeholder-count="3"><div style="flex:0 0 100%;scroll-snap-align:center;padding:0 20px;box-sizing:border-box"><div style="aspect-ratio:4/5;border-radius:999px 999px 0 0;overflow:hidden;background:var(--ml-ivory-deep)"><sc-if value="{{ image.cutout }}" hint-placeholder-val="{{ false }}"><img src="{{ image.src }}" alt="{{ vm.piece.name }}" style="width:100%;height:100%;display:block;object-fit:contain;mix-blend-mode:multiply"></sc-if><sc-if value="{{ image.photo }}" hint-placeholder-val="{{ true }}"><img src="{{ image.src }}" alt="{{ vm.piece.name }}" style="width:100%;height:100%;display:block;object-fit:cover"></sc-if></div></div></sc-for>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;padding-top:14px"><div style="display:flex;gap:6px"><sc-for list="{{ images }}" as="image" hint-placeholder-count="3"><sc-if value="{{ image.active }}" hint-placeholder-val="{{ false }}"><span style="height:7px;width:22px;border-radius:999px;background:var(--ml-ochre)"></span></sc-if><sc-if value="{{ image.idle }}" hint-placeholder-val="{{ true }}"><span style="height:7px;width:7px;border-radius:999px;background:var(--ml-ink-20)"></span></sc-if></sc-for></div><span dir="ltr" style="font-family:var(--font-latin);font-size:13px;color:var(--ml-ink-50)">{{ counter }}</span></div>
</sc-if>
</div>
<div style="position:sticky;top:100px;display:flex;flex-direction:column;gap:20px;min-width:0">
<span style="font-family:var(--font-latin);font-size:13px;color:var(--ml-ochre)">{{ vm.piece.hallLabel }}</span>
<h1 style="margin:0;font-size:clamp(28px,3.6cqi,44px);font-weight:500;line-height:1.3">{{ vm.piece.name }}</h1>
<div style="height:2px;background:var(--ml-ochre)"></div>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:15px"><sc-for list="{{ vm.piece.features }}" as="feature" hint-placeholder-count="3"><sc-if value="{{ feature.separated }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;border-radius:50%;background:var(--ml-ochre)"></span></sc-if><span>{{ feature.text }}</span></sc-for></div>
<p style="margin:0;font-size:16px;line-height:1.85;color:var(--ml-ink-70);text-wrap:pretty">{{ vm.piece.lead }}</p>
<dl style="margin:0;display:flex;flex-direction:column;border-top:1px solid var(--ml-ink-20)">
<sc-for list="{{ vm.piece.specs }}" as="spec" hint-placeholder-count="3"><div style="display:grid;grid-template-columns:minmax(80px,120px) 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--ml-ink-20);font-size:15px"><dt style="color:var(--ml-ink-50)">{{ spec.label }}</dt><dd style="margin:0">{{ spec.value }}</dd></div></sc-for>
</dl>
<sc-if value="{{ vm.notMobile }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:12px;padding-top:4px">
<x-import component-from-global-scope="MagicLookDesignSystem_1440af.Button" size="lg" full-width="{{ true }}" onClick="{{ vm.openWhatsApp }}" hint-size="100%,56px">استفسر عبر واتساب</x-import>
<div style="display:flex;flex-wrap:wrap;gap:12px"><x-import component-from-global-scope="MagicLookDesignSystem_1440af.Button" variant="secondary" onClick="{{ vm.piece.toggleSaved }}" style="flex:1 1 180px" hint-size="200px,44px">{{ vm.piece.saveText }}</x-import><x-import component-from-global-scope="MagicLookDesignSystem_1440af.Button" variant="ghost" onClick="{{ vm.openVisit }}" style="flex:1 1 180px" hint-size="150px,44px">احجز زيارة لمعاينتها</x-import></div>
</div>
</sc-if>
<p style="margin:0;font-size:13px;line-height:1.7;color:var(--ml-ink-50)">{{ vm.sizesNote }}</p>
</div>
</div>
<section style="margin-top:clamp(48px,7cqi,100px)">
<dc-import name="UiSectionHeading" kicker="التفاصيل" title="جماله في تفاصيله" hint-size="100%,90px"></dc-import>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:clamp(24px,5cqi,72px);align-items:center;margin-top:clamp(24px,3cqi,40px)">
<div style="position:relative;border-radius:24px;overflow:hidden;background:var(--ml-ivory-deep);justify-self:center;width:fit-content;max-width:100%">
<sc-if value="{{ detailCutout }}" hint-placeholder-val="{{ false }}"><img src="{{ vm.piece.detail.src }}" alt="{{ vm.piece.name }}" style="display:block;width:auto;height:auto;max-width:100%;max-height:640px;mix-blend-mode:multiply"></sc-if><sc-if value="{{ detailPhoto }}" hint-placeholder-val="{{ true }}"><img src="{{ vm.piece.detail.src }}" alt="{{ vm.piece.name }}" style="display:block;width:auto;height:auto;max-width:100%;max-height:640px"></sc-if>
<sc-for list="{{ spots }}" as="spot" hint-placeholder-count="4">
<sc-if value="{{ spot.active }}" hint-placeholder-val="{{ false }}"><button type="button" ref="{{ spot.place }}" onClick="{{ spot.select }}" aria-label="{{ spot.label }}" aria-pressed="true" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1.12);width:34px;height:34px;border-radius:50%;border:2px solid var(--ml-ochre);background:var(--ml-ochre);color:#fff;font-family:var(--font-latin);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(244,240,232,.55)">{{ spot.no }}</button></sc-if>
<sc-if value="{{ spot.idle }}" hint-placeholder-val="{{ true }}"><button type="button" ref="{{ spot.place }}" onClick="{{ spot.select }}" aria-label="{{ spot.label }}" aria-pressed="false" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2px solid var(--ml-ochre);background:var(--ml-ivory);color:var(--ml-ink);font-family:var(--font-latin);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(244,240,232,.55)">{{ spot.no }}</button></sc-if>
</sc-for>
<div ref="{{ lensRef }}" aria-hidden="true" style="position:absolute;top:16px;right:16px;width:clamp(104px,15cqi,176px);aspect-ratio:1/1;border-radius:50%;border:3px solid var(--ml-ochre-300);background-color:var(--ml-ivory-deep);background-size:320% auto;background-repeat:no-repeat;box-shadow:var(--shadow-soft);transition:background-position 480ms cubic-bezier(.22,.61,.36,1)"></div>
</div>
<ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--ml-ink-20)">
<sc-for list="{{ spots }}" as="spot" hint-placeholder-count="4"><li><button type="button" onClick="{{ spot.select }}" style="width:100%;display:flex;gap:16px;align-items:flex-start;padding:18px 4px;border:0;border-bottom:1px solid var(--ml-ink-20);background:none;cursor:pointer;font-family:inherit;text-align:start;color:inherit"><sc-if value="{{ spot.active }}" hint-placeholder-val="{{ false }}"><span style="width:30px;height:30px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--ml-ochre);background:var(--ml-ochre);color:#fff;font-family:var(--font-latin);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ spot.no }}</span></sc-if><sc-if value="{{ spot.idle }}" hint-placeholder-val="{{ true }}"><span style="width:30px;height:30px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--ml-ochre);background:var(--ml-ivory);color:var(--ml-ink);font-family:var(--font-latin);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ spot.no }}</span></sc-if><span style="display:flex;flex-direction:column;gap:4px;padding-top:3px"><span style="font-size:17px;font-weight:500">{{ spot.label }}</span><span style="font-size:14px;line-height:1.7;color:var(--ml-ink-70)">{{ spot.note }}</span></span></button></li></sc-for>
</ol>
</div>
</section>
<section style="margin-top:clamp(48px,7cqi,100px);display:flex;flex-direction:column;gap:clamp(24px,3cqi,40px)">
<dc-import name="UiSectionHeading" kicker="من المعرض" title="قطع أخرى" action-label="كل القطع" on-action="{{ vm.goHalls }}" hint-size="100%,90px"></dc-import>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:clamp(24px,3cqi,40px) clamp(14px,2cqi,24px)">
<sc-for list="{{ vm.related }}" as="piece" hint-placeholder-count="3"><dc-import name="PieceCard" p="{{ piece }}" variant="overlay" n="{{ $index }}" show-save="{{ false }}" hint-size="100%,380px"></dc-import></sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
// Gallery + detail hotspots. Pure view state (selected image / spot); the piece itself comes from the presenter.
// Hotspot and lens geometry is data-driven, so it is applied through refs rather than style holes.
const LENS_ZOOM = 3.2;
const LENS_INSET = '16px';
const EMPTY_PIECE = { images: [], spots: [], detail: {} };

const wrap = (index, length) => (index + length) % length;

// Background position that centres the lens on (x%, y%) of an image with the given aspect ratio.
function lensFor(spot, detail) {
  const [w, h] = String(detail.ratio || '1/1').split('/').map(Number);
  const axis = (pct, zoom) => (((0.5 - zoom * pct / 100) / (1 - zoom)) * 100).toFixed(1) + '%';
  const onLeftHalf = spot.x < 50;
  return {
    backgroundImage: detail.src ? 'url(' + detail.src + ')' : 'none',
    backgroundPosition: axis(spot.x, LENS_ZOOM) + ' ' + axis(spot.y, LENS_ZOOM * (h / w)),
    backgroundBlendMode: detail.cutout ? 'multiply' : 'normal',
    left: onLeftHalf ? 'auto' : LENS_INSET,
    right: onLeftHalf ? LENS_INSET : 'auto'
  };
}

const placeAt = spot => element => {
  if (!element) return;
  element.style.left = spot.x + '%';
  element.style.top = spot.y + '%';
};

class Component extends DCLogic {
  state = { imageIndex: 0, spotIndex: 0 };
  stripRef = React.createRef();
  lensRef = React.createRef();

  componentDidMount() { this.applyLens(); }

  componentDidUpdate(prev) {
    this.applyLens();
    const pieceId = vm => vm && vm.piece && vm.piece.id;
    if (pieceId(prev.vm) === pieceId(this.props.vm)) return;
    this.setState({ imageIndex: 0, spotIndex: 0 });
    if (this.stripRef.current) this.stripRef.current.scrollLeft = 0;
  }

  piece() { return (this.props.vm && this.props.vm.piece) || EMPTY_PIECE; }

  applyLens() {
    const lens = this.lensRef.current;
    const piece = this.piece();
    const spot = piece.spots[this.state.spotIndex];
    if (lens && spot) Object.assign(lens.style, lensFor(spot, piece.detail));
  }

  showImage(index, count) { this.setState({ imageIndex: wrap(index, count) }); }

  onStripScroll = event => {
    const strip = event.currentTarget;
    const index = Math.round(Math.abs(strip.scrollLeft) / Math.max(1, strip.clientWidth));
    if (index !== this.state.imageIndex) this.setState({ imageIndex: index });
  };

  renderVals() {
    const piece = this.piece();
    const count = Math.max(1, piece.images.length);
    const imageIndex = Math.min(this.state.imageIndex, count - 1);
    const images = piece.images.map((image, i) => ({
      src: image.src, no: i + 1,
      cutout: Boolean(image.cutout), photo: !image.cutout,
      active: i === imageIndex, idle: i !== imageIndex,
      select: () => this.showImage(i, count)
    }));
    const spots = piece.spots.map((spot, i) => ({
      ...spot, no: i + 1,
      active: i === this.state.spotIndex, idle: i !== this.state.spotIndex,
      place: placeAt(spot),
      select: () => this.setState({ spotIndex: i })
    }));
    return {
      images,
      current: images[imageIndex] || {},
      counter: (imageIndex + 1) + ' / ' + count,
      showNext: () => this.showImage(imageIndex + 1, count),
      showPrevious: () => this.showImage(imageIndex - 1, count),
      stripRef: this.stripRef,
      onStripScroll: this.onStripScroll,
      spots,
      lensRef: this.lensRef,
      detailCutout: Boolean(piece.detail.cutout),
      detailPhoto: !piece.detail.cutout
    };
  }
}
</script>
</body>
</html>
