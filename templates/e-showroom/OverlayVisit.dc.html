<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div data-screen-label="Book a visit" role="dialog" aria-modal="true" aria-label="احجز زيارة" style="position:absolute;top:0;left:0;right:0;bottom:0;font-family:var(--font-arabic);color:var(--ml-ink)">
<div data-anim="scrim" onClick="{{ vm.close }}" style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(23,25,27,.45)"></div>
<div data-anim="panel-modal" style="position:absolute;left:50%;bottom:min(50%, max(0px, calc((100cqi - 640px) * 999)));transform:translate(-50%, min(50%, max(0%, calc((100cqi - 640px) * 999))));width:max(min(580px, calc(100% - 32px)), min(100%, calc((640px - 100cqi) * 999)));max-height:calc(100% - 40px);border-radius:24px 24px min(24px, max(0px, calc((100cqi - 640px) * 999))) min(24px, max(0px, calc((100cqi - 640px) * 999)));background:var(--ml-ivory);box-shadow:var(--shadow-soft);display:flex;flex-direction:column;overflow:hidden">
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px 16px;border-bottom:1px solid var(--ml-ink-20)">
<h2 style="margin:0;font-size:22px;font-weight:500">احجز زيارة للمعرض</h2>
<button type="button" onClick="{{ vm.close }}" aria-label="إغلاق" style="width:44px;height:44px;margin-inline-end:-10px;border:0;border-radius:999px;background:none;color:var(--ml-ink);cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
<sc-if value="{{ editing }}" hint-placeholder-val="{{ true }}">
<div style="flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:22px">
<span style="display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.7;color:var(--ml-ink-70)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ml-ochre)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:3px"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>{{ vm.address }}</span>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px">
<label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500">الاسم<input type="text" value="{{ name }}" onChange="{{ onName }}" placeholder="الاسم الكريم" autocomplete="name" style="height:48px;padding:0 16px;border:1px solid var(--ml-ink-20);border-radius:12px;background:var(--ml-white);font-family:inherit;font-size:16px;color:var(--ml-ink);outline-color:var(--ml-ochre-300)"></label>
<label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500">رقم الجوال<input type="tel" dir="ltr" value="{{ phone }}" onChange="{{ onPhone }}" placeholder="05X XXX XXXX" autocomplete="tel" style="height:48px;padding:0 16px;border:1px solid var(--ml-ink-20);border-radius:12px;background:var(--ml-white);font-family:var(--font-latin);font-size:16px;color:var(--ml-ink);text-align:right;outline-color:var(--ml-ochre-300)"></label>
</div>
<div role="group" aria-label="اليوم" style="display:flex;flex-direction:column;gap:10px"><span style="font-size:14px;font-weight:500">اليوم</span>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px">
<sc-for list="{{ days }}" as="day" hint-placeholder-count="6"><sc-if value="{{ day.selected }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ day.select }}" aria-pressed="{{ day.selected }}" style="height:64px;border-radius:12px;border:1px solid var(--ml-ink);background:var(--ml-ink);color:var(--ml-ivory);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:border-color 140ms" style-hover="border-color:var(--ml-ink)"><span style="font-size:14px;font-weight:500">{{ day.weekday }}</span><span style="font-family:var(--font-latin);font-size:12px;opacity:.8">{{ day.date }}</span></button></sc-if><sc-if value="{{ day.idle }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ day.select }}" aria-pressed="{{ day.selected }}" style="height:64px;border-radius:12px;border:1px solid var(--ml-ink-20);background:var(--ml-white);color:var(--ml-ink);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:border-color 140ms" style-hover="border-color:var(--ml-ink)"><span style="font-size:14px;font-weight:500">{{ day.weekday }}</span><span style="font-family:var(--font-latin);font-size:12px;opacity:.8">{{ day.date }}</span></button></sc-if></sc-for>
</div></div>
<div role="group" aria-label="الفترة" style="display:flex;flex-direction:column;gap:10px"><span style="font-size:14px;font-weight:500">الفترة</span>
<div style="display:flex;gap:8px"><sc-for list="{{ periods }}" as="period" hint-placeholder-count="2"><sc-if value="{{ period.selected }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ period.select }}" aria-pressed="{{ period.selected }}" style="flex:1;height:48px;border-radius:999px;border:1px solid var(--ml-ink);background:var(--ml-ink);color:var(--ml-ivory);cursor:pointer;font-family:inherit;font-size:15px;transition:border-color 140ms" style-hover="border-color:var(--ml-ink)">{{ period.label }}</button></sc-if><sc-if value="{{ period.idle }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ period.select }}" aria-pressed="{{ period.selected }}" style="flex:1;height:48px;border-radius:999px;border:1px solid var(--ml-ink-20);background:var(--ml-white);color:var(--ml-ink);cursor:pointer;font-family:inherit;font-size:15px;transition:border-color 140ms" style-hover="border-color:var(--ml-ink)">{{ period.label }}</button></sc-if></sc-for></div></div>
<sc-if value="{{ vm.hasPieces }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;background:var(--ml-ivory-deep)"><span style="font-size:14px;font-weight:500">القطع التي تود معاينتها</span><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ vm.pieceNames }}" as="pieceName" hint-placeholder-count="2"><span style="height:30px;padding:0 12px;border-radius:999px;background:var(--ml-ivory);font-size:13px;display:flex;align-items:center">{{ pieceName }}</span></sc-for></div></div></sc-if>
</div>
<div style="padding:16px 24px 24px;border-top:1px solid var(--ml-ink-20);display:flex;flex-direction:column;gap:8px">
<x-import component-from-global-scope="MagicLookDesignSystem_1440af.Button" size="lg" full-width="{{ true }}" disabled="{{ incomplete }}" onClick="{{ submit }}" hint-size="100%,56px">إرسال الطلب عبر واتساب</x-import>
<span style="font-size:12px;color:var(--ml-ink-50);text-align:center">{{ hint }}</span>
</div>
</sc-if>
<sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
<div style="padding:48px 32px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
<x-import component-from-global-scope="MagicLookDesignSystem_1440af.LogoMark" size="{{ 40 }}" hint-size="54px,40px"></x-import>
<span style="font-size:22px;font-weight:500">طلبك جاهز للإرسال</span>
<span style="font-size:15px;line-height:1.8;color:var(--ml-ink-70);max-width:340px">بعد إرسال الرسالة في واتساب يتواصل فريق المعرض معك لتأكيد الموعد.</span>
<div style="display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:999px;background:var(--ml-ivory-deep);font-size:15px"><span>{{ summary.day }}</span><span style="width:6px;height:6px;border-radius:50%;background:var(--ml-ochre)"></span><span>{{ summary.period }}</span></div>
<div style="padding-top:8px"><x-import component-from-global-scope="MagicLookDesignSystem_1440af.Button" variant="secondary" onClick="{{ vm.close }}" hint-size="100px,44px">إغلاق</x-import></div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const HINT = { ready: 'تُفتح محادثة واتساب برسالة جاهزة.', pending: 'أكمل الاسم والجوال واليوم والفترة.' };
const EMPTY_SUMMARY = { day: '', period: '' };

class Component extends DCLogic {
  state = { name: '', phone: '', dayId: null, periodId: null, sent: false };

  form() {
    const { name, phone, dayId, periodId } = this.state;
    return { name, phone, dayId, periodId };
  }

  choices(options, selectedId, key) {
    return (options || []).map(option => {
      const selected = option.id === selectedId;
      return { ...option, selected, idle: !selected, select: () => this.setState({ [key]: option.id }) };
    });
  }

  renderVals() {
    const vm = this.props.vm || {};
    const form = this.form();
    const complete = Boolean(vm.isComplete && vm.isComplete(form));
    return {
      editing: !this.state.sent,
      sent: this.state.sent,
      name: form.name,
      phone: form.phone,
      onName: event => this.setState({ name: event.target.value }),
      onPhone: event => this.setState({ phone: event.target.value }),
      days: this.choices(vm.days, form.dayId, 'dayId'),
      periods: this.choices(vm.periods, form.periodId, 'periodId'),
      incomplete: !complete,
      hint: complete ? HINT.ready : HINT.pending,
      summary: this.state.sent && vm.describe ? vm.describe(form) : EMPTY_SUMMARY,
      submit: () => { if (vm.submit && vm.submit(form)) this.setState({ sent: true }); }
    };
  }
}
</script>
</body>
</html>
