<!DOCTYPE html><html lang="ar"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ml-ivory);color:var(--ml-ink);font-family:var(--font-body);padding:24px;box-sizing:border-box;height:150px}.l{font-family:var(--font-latin);font-size:12px;letter-spacing:.06em;color:var(--ml-ink-70)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:72px;border-radius:12px;border:1px solid rgba(23,25,27,.08)}b{font-family:var(--font-latin);font-size:13px}</style></head><body><div class="row"><div class="sw" style="align-items:center"><div style="width:88px;height:64px;background:var(--ml-ivory-deep);border:1px solid var(--ml-ochre-300);border-radius:6px"></div><span class="l">sm · 6px</span></div><div class="sw" style="align-items:center"><div style="width:88px;height:64px;background:var(--ml-ivory-deep);border:1px solid var(--ml-ochre-300);border-radius:12px"></div><span class="l">md · 12px</span></div><div class="sw" style="align-items:center"><div style="width:88px;height:64px;background:var(--ml-ivory-deep);border:1px solid var(--ml-ochre-300);border-radius:24px"></div><span class="l">lg · 24px</span></div><div class="sw" style="align-items:center"><div style="width:88px;height:64px;background:var(--ml-ivory-deep);border:1px solid var(--ml-ochre-300);border-radius:40px"></div><span class="l">xl · 40px</span></div><div class="sw" style="align-items:center"><div style="width:88px;height:64px;background:var(--ml-ivory-deep);border:1px solid var(--ml-ochre-300);border-radius:999px"></div><span class="l">pill · pill</span></div></div></body></html>
