<!DOCTYPE html><html lang="ar"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ml-ivory);color:var(--ml-ink);font-family:var(--font-body);padding:24px;box-sizing:border-box;height:170px}.l{font-family:var(--font-latin);font-size:12px;letter-spacing:.06em;color:var(--ml-ink-70)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:72px;border-radius:12px;border:1px solid rgba(23,25,27,.08)}b{font-family:var(--font-latin);font-size:13px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-page);display:flex;align-items:center;justify-content:center;font-family:var(--font-latin);font-size:13px;color:var(--ml-ink)">Aa نص</div><span class="l">--surface-page</span></div><div class="sw"><div class="chip" style="background:var(--surface-card);display:flex;align-items:center;justify-content:center;font-family:var(--font-latin);font-size:13px;color:var(--ml-ink)">Aa نص</div><span class="l">--surface-card</span></div><div class="sw"><div class="chip" style="background:var(--surface-raised);display:flex;align-items:center;justify-content:center;font-family:var(--font-latin);font-size:13px;color:var(--ml-ink)">Aa نص</div><span class="l">--surface-raised</span></div><div class="sw"><div class="chip" style="background:var(--surface-inverse);display:flex;align-items:center;justify-content:center;font-family:var(--font-latin);font-size:13px;color:var(--ml-ivory)">Aa نص</div><span class="l">--surface-inverse</span></div><div class="sw"><div class="chip" style="background:var(--surface-accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-latin);font-size:13px;color:#fff">Aa نص</div><span class="l">--surface-accent</span></div></div></body></html>
