<!DOCTYPE html><html lang="ar"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ml-ivory);color:var(--ml-ink);font-family:var(--font-body);padding:24px;box-sizing:border-box;height:170px}.l{font-family:var(--font-latin);font-size:12px;letter-spacing:.06em;color:var(--ml-ink-70)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:72px;border-radius:12px;border:1px solid rgba(23,25,27,.08)}b{font-family:var(--font-latin);font-size:13px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ml-ochre)"></div><b>OCHRE</b><span class="l">#7B5D08 · 10%</span></div><div class="sw"><div class="chip" style="background:var(--ml-ink)"></div><b>INK</b><span class="l">#17191B · 30%</span></div><div class="sw"><div class="chip" style="background:var(--ml-ivory)"></div><b>IVORY</b><span class="l">#F4F0E8 · 60%</span></div><div class="sw"><div class="chip" style="background:var(--ml-white)"></div><b>WHITE</b><span class="l">#FFFFFF · 60%</span></div></div></body></html>
