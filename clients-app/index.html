<title>ملفات عملاء النظرة الساحرة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: green app bar, client list → client file with 3 tabs (requirements / sketch / site survey), paper-like canvases for Apple Pencil. Single light look, brand colours. */
:root{
  --green:#253a35; --green-2:#304a44; --bronze:#a68356; --bronze-d:#8a6a40; --beige:#d6c9b5;
  --paper:#ffffff; --bg:#f3efe9; --tint:#f7f4f0; --tint-2:#efe9e1; --line:#ddd2c3; --muted:#6d7a76;
  --danger:#a63d32;
  --font:'Lama Sans','Tajawal',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--green);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--green);color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--green)}
.bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:44px}
.bar .logo{height:34px;width:auto;display:block}
.bar .sp{flex:1}
.bar .crumb{display:flex;align-items:center;gap:10px;min-width:0}
.bar .crumb b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12.5px;color:var(--beige);white-space:nowrap}
.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7fb08f;margin-left:6px;vertical-align:1px}
.status.busy i{background:var(--bronze)}
.status.err i{background:#e07a6c}
.slash{display:inline-block;width:5px;height:22px;background:var(--bronze);transform:skewX(-20deg);margin-inline:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid transparent;font-weight:700;background:var(--tint-2);color:var(--green)}
.btn.pri{background:var(--bronze);color:#fff}
.btn.pri:active{background:var(--bronze-d)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn.line{background:#fff;border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn.danger{color:var(--danger)}
.btn svg{width:18px;height:18px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:1180px;margin:0 auto}

/* home */
.home-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
.home-head h1{font-size:26px;margin:0;font-weight:800;flex:1;min-width:200px}
.search{flex:1 1 260px;max-width:380px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-align:right;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative;overflow:hidden}
.ccard::after{content:"";position:absolute;top:0;left:22px;width:26px;height:4px;background:var(--bronze);transform:skewX(-35deg)}
.ccard b{font-size:18px}
.ccard .meta{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.ccard .pills{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.pill{font-size:12px;background:var(--tint-2);border-radius:20px;padding:3px 10px;color:var(--green)}
.empty{background:#fff;border:1px dashed var(--beige);border-radius:16px;padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{margin:0;font-size:21px}
.empty p{margin:0;color:var(--muted);max-width:520px;line-height:1.7}
.empty .sheets{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.mini{width:120px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 10px 8px;font-size:12px;box-shadow:0 2px 0 var(--tint-2)}
.mini .t{height:6px;background:var(--green);border-radius:2px;margin-bottom:8px}
.mini .l{height:4px;background:var(--tint-2);border-radius:2px;margin:5px 0}
.mini .g{height:52px;border-radius:3px;background-image:radial-gradient(circle,#c2b49f 1px,transparent 1.3px);background-size:7px 7px;border:1px solid var(--tint-2)}
.mini .gr{height:52px;border-radius:3px;background-image:linear-gradient(to right,#e3dacd 1px,transparent 1px),linear-gradient(#e3dacd 1px,transparent 1px);background-size:8px 8px;border:1px solid var(--tint-2)}
.mini span{display:block;margin-top:6px;font-weight:700}

/* client */
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel+.panel{margin-top:14px}
.ph{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:17px;font-weight:800}
.ph::before{content:"";width:5px;height:18px;background:var(--bronze);transform:skewX(-20deg)}
.ph small{font-weight:500;font-size:11px;letter-spacing:.25em;color:var(--bronze);direction:ltr}
.ph .r{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-size:13px;font-weight:700;color:var(--bronze)}
.in{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--tint);padding:0 12px}
.in:focus{background:#fff;border-color:var(--bronze);outline:none}
textarea.in{padding:10px 12px;line-height:1.6;resize:vertical;min-height:44px}
.tabs{display:flex;gap:6px;background:var(--tint-2);padding:5px;border-radius:12px;margin:16px 0 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:10}
.tab{flex:1;min-height:46px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tab.on{background:var(--green);color:#fff}
.tab .n{font-size:12px;background:rgba(0,0,0,.08);border-radius:10px;padding:1px 8px}
.tab.on .n{background:rgba(255,255,255,.18)}

/* requirements */
.reqs{display:flex;flex-direction:column}
.rq{display:grid;grid-template-columns:40px minmax(0,1.1fr) minmax(0,2.6fr) 80px 150px 40px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--tint-2)}
.rq.head{font-size:13px;font-weight:700;color:var(--muted);padding-top:0}
.num{width:32px;height:32px;border-radius:50%;background:var(--tint-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.seg{display:flex;background:var(--tint);border:1px solid var(--line);border-radius:9px;overflow:hidden;min-height:44px}
.seg button{flex:1;border:0;background:transparent;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--green);color:#fff}
.x{width:40px;height:40px;border:0;border-radius:8px;background:transparent;color:#b2a796;font-size:22px;line-height:1}
.x:active{background:var(--tint-2)}
.addrow{margin-top:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* pads */
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--green)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.add{border-style:dashed;color:var(--bronze)}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;background:var(--tint);border:1px solid var(--line);border-radius:12px 12px 0 0;border-bottom:0}
.tool .g{display:flex;gap:4px;align-items:center;padding-inline:4px}
.tool .sep{width:1px;height:28px;background:var(--line)}
.tb{min-width:44px;height:44px;border-radius:9px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--green);font-weight:700;font-size:13px;padding:0 8px}
.tb.on{background:#fff;border-color:var(--bronze);box-shadow:0 1px 0 var(--tint-2)}
.tb svg{width:22px;height:22px}
.tb[disabled]{opacity:.35}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--bronze)}
.wd{width:40px;height:40px;border-radius:9px;border:1px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center}
.wd i{display:block;border-radius:50%;background:var(--green)}
.wd.on{background:#fff;border-color:var(--bronze)}
.padbox{position:relative;border:1px solid var(--line);border-radius:0 0 12px 12px;overflow:hidden;background:#fff}
.padbox canvas{display:block;width:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.padbox .bgc{position:absolute;inset:0;pointer-events:none}
.padbox.sign{border-radius:12px;max-width:420px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);padding:0 6px;min-height:44px;border:0;background:transparent}
.toggle i{width:38px;height:22px;border-radius:12px;background:var(--line);position:relative;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:right .15s}
.toggle.on i{background:var(--green)}
.toggle.on i::after{right:19px}

/* table */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table.dims{border-collapse:collapse;width:100%;min-width:860px}
.dims th{background:var(--green);color:#fff;font-size:13px;font-weight:700;padding:8px 6px;text-align:center}
.dims tr.sub th{background:var(--tint-2);color:var(--green);font-weight:500;font-size:12px;padding:4px}
.dims td{border-top:1px solid var(--tint-2);padding:5px 4px}
.dims td .in{min-height:40px;text-align:center;padding:0 6px}
.dims td:first-child .in,.dims td.nt .in{text-align:right}
.checks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.ck{display:flex;align-items:center;gap:10px;min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;text-align:right;font-weight:500}
.ck i{width:22px;height:22px;border-radius:6px;border:2px solid var(--bronze);flex:none;display:flex;align-items:center;justify-content:center}
.ck.on{border-color:var(--green);background:var(--tint)}
.ck.on i{background:var(--green);border-color:var(--green)}
.ck.on i::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:8px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{height:16px;width:auto}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(22,33,30,.72);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.ovc{background:var(--bg);border-radius:16px;width:min(980px,100%);padding:18px}
.ovh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ovh h2{margin:0;font-size:20px;flex:1}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pages figure{margin:0;background:#fff;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.12);overflow:hidden}
.pages img{width:100%;display:block}
.pages figcaption{font-size:12.5px;color:var(--muted);padding:6px 10px}
.note{font-size:14px;color:var(--muted);line-height:1.7}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fbeeea;border:1px solid #efc9c0;border-radius:10px;padding:8px 12px;font-size:14px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}

.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.att{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.att a{display:block;aspect-ratio:4/3;background:var(--tint);position:relative}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att .pdf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--danger);font-weight:800;font-size:13px}
.att .pdf svg{width:44px;height:44px}
.att .meta{padding:8px;display:flex;gap:6px;align-items:center}
.att .meta input{flex:1;min-width:0;min-height:36px;font-size:13px}
.att .meta .x{width:36px;height:36px;font-size:13px;color:var(--danger);font-weight:700}
.att .meta .x.armed{background:#fbeeea;width:auto;padding:0 8px}
.drop{border:2px dashed var(--beige);border-radius:12px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
.drop.over{border-color:var(--bronze);background:var(--tint)}
.drop svg{width:34px;height:34px;color:var(--bronze)}
.upl{font-size:13px;color:var(--bronze);font-weight:700}
@media (max-width:1100px){.status span{display:none}}
.btn{white-space:nowrap}
@media (max-width:900px){
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rq{grid-template-columns:36px minmax(0,1fr) 70px 40px;grid-template-areas:"n room qty x" "n desc desc desc" "n prio prio prio"}
  .rq>:nth-child(1){grid-area:n;align-self:start}.rq>:nth-child(2){grid-area:room}.rq>:nth-child(3){grid-area:desc}
  .rq>:nth-child(4){grid-area:qty}.rq>:nth-child(5){grid-area:prio}.rq>:nth-child(6){grid-area:x}
  .rq.head{display:none}
  .checks{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .fgrid,.row3{grid-template-columns:minmax(0,1fr)}
  .bar .logo{display:none}
  .status span{display:none}
  .bar .sp{display:none}
  .bar .crumb{flex:1}
  .bar-in{gap:8px}
  .tab .n{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- strokes: compact encoding ---------- */
function encStrokes(arr){return arr.map(s=>s.c+','+s.w+(s.t?','+s.t:'')+':'+s.p.join(',')).join('|')}
function decStrokes(str){if(!str)return[];return str.split('|').filter(Boolean).map(x=>{const[h,pts]=x.split(':');const hp=h.split(',');return{c:+hp[0],w:+hp[1],t:hp[2]||'',p:pts?pts.split(',').map(Number):[]}})}
function drawStrokes(ctx,strokes){
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const s of strokes){
    const p=s.p;if(p.length<2)continue;
    ctx.strokeStyle=COLORS[s.c]||COLORS[0];ctx.lineWidth=s.w;ctx.beginPath();ctx.moveTo(p[0],p[1]);
    if(p.length===2){ctx.lineTo(p[0]+.1,p[1]+.1)}
    else if(s.t==='L'||p.length===4){for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1])}
    else{for(let i=2;i<p.length-2;i+=2){const mx=(p[i]+p[i+2])/2,my=(p[i+1]+p[i+3])/2;ctx.quadraticCurveTo(p[i],p[i+1],mx,my)}ctx.lineTo(p[p.length-2],p[p.length-1])}
    ctx.stroke();
  }
}
/* background in mm-space (ctx already scaled so 1 unit = 1mm) */
function drawBg(ctx,w,h,kind){
  if(kind==='dots'){ctx.fillStyle='#b9ab96';for(let y=2.5;y<h;y+=5)for(let x=2.5;x<w;x+=5){ctx.beginPath();ctx.arc(x,y,.28,0,7);ctx.fill()}}
  if(kind==='grid'){
    const cx=w/2,cy=h/2;
    const lines=(step,col,lw)=>{ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();
      for(let x=cx%step;x<=w;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,h)}
      for(let y=cy%step;y<=h;y+=step){ctx.moveTo(0,y);ctx.lineTo(w,y)}ctx.stroke()};
    lines(5,'#ece5db',.15);lines(25,'#cdbfab',.22);
  }
}

/* ---------- storage ---------- */
const idb={_p:null,
  open(){if(this._p)return this._p;this._p=new Promise((res,rej)=>{let q;try{q=indexedDB.open('magiclook-clients',1)}catch(e){rej(e);return}q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});return this._p},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv',mode);const st=t.objectStore('kv');const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(k){return this.tx('readonly',st=>st.get(k))},
  set(k,v){return this.tx('readwrite',st=>{st.put(v,k)})},
  del(k){return this.tx('readwrite',st=>{st.delete(k)})},
  keys(){return this.tx('readonly',st=>st.getAllKeys())}
};
const store={mode:'none',db:null,uid:null,
  col(){return this.db.collection('data/users/'+this.uid)},
  async list(){
    if(this.mode==='db'){const snap=await this.col().where('kind','==','client').get();return snap.docs.map(d=>d.data())}
    const keys=(await idb.keys()).filter(k=>String(k).startsWith('c_'));const out=[];for(const k of keys){const v=await idb.get(k);if(v)out.push(v)}return out;
  },
  async saveClient(c){if(this.mode==='db'){await this.col().doc('c_'+c.id).set(c);return}await idb.set('c_'+c.id,c)},
  async getDrawing(cid,did){
    if(this.mode==='db'){const s=await this.col().doc('d_'+cid+'_'+did).get();return s.exists?(s.data().s||''):''}
    return(await idb.get('d_'+cid+'_'+did))||'';
  },
  async saveDrawing(cid,did,str){if(this.mode==='db'){await this.col().doc('d_'+cid+'_'+did).set({kind:'drawing',cid,s:str});return}await idb.set('d_'+cid+'_'+did,str)},
  async remove(c){
    const dids=drawingIds(c);
    if(this.mode==='db'){for(const d of dids){try{await this.col().doc('d_'+c.id+'_'+d).delete()}catch(e){}}await this.col().doc('c_'+c.id).delete();return}
    for(const d of dids)await idb.del('d_'+c.id+'_'+d);for(const a of(c.attachments||[]))await idb.del('blob_'+a.id);await idb.del('c_'+c.id);
  }
};
function drawingIds(c){return['sign',...c.sketches.map(s=>s.id),...c.plans.map(p=>p.id)]}

/* ---------- save scheduling ---------- */
const timers={},inflight={},again={};
function setStatus(kind,text){const el=$('#status');el.className='status'+(kind?' '+kind:'');el.lastChild.textContent=text}
function savedText(){return store.mode==='db'?'محفوظ في حسابك':'محفوظ على هذا الجهاز'}
function schedule(key,fn,ms=900){
  clearTimeout(timers[key]);setStatus('busy','جارٍ الحفظ…');
  timers[key]=setTimeout(()=>run(key,fn),ms);
}
async function run(key,fn){
  if(inflight[key]){again[key]=fn;return}
  inflight[key]=true;
  try{await fn();setStatus('',savedText())}
  catch(e){console.warn(e);setStatus('err',e&&e.code==='quota'?'مساحة الجهاز ممتلئة':'تعذّر الحفظ، سنعيد المحاولة');timers[key]=setTimeout(()=>run(key,fn),5000)}
  inflight[key]=false;
  if(again[key]){const f=again[key];again[key]=null;run(key,f)}
}
function touchClient(){const c=cur();if(!c)return;c.updatedAt=Date.now();const snap=JSON.parse(JSON.stringify(c));schedule('c_'+c.id,()=>store.saveClient(snap))}
function saveDrawingLater(did){const c=cur();const cid=c.id;const str=encStrokes(S.draw[did]||[]);
  if(str.length>240000){setStatus('err','الرسمة كبيرة جدًا، أضف صفحة جديدة');return}
  schedule('d_'+cid+'_'+did,()=>store.saveDrawing(cid,did,str),700)}

function buildPages(c){
  const pages=[];
  const reqs=c.reqs.filter(r=>r.room||r.desc||r.qty||r.prio);const chunks=[];for(let i=0;i<Math.max(1,reqs.length);i+=18)chunks.push(reqs.slice(i,i+18));
  const roomRows=c.rooms.filter(r=>Object.values(r).some(Boolean));const nSite=Math.max(c.plans.length,Math.ceil(roomRows.length/7),1);
  const imgs=(c.attachments||[]).filter(a=>a.type==='img'&&ATTIMG[a.id]);const pdfs=(c.attachments||[]).filter(a=>a.type==='pdf');
  const nAtt=imgs.length?Math.ceil(imgs.length/2):(pdfs.length?1:0);
  const total=chunks.length+c.sketches.length+nSite+nAtt;let pg=1;
  chunks.forEach((ch,i)=>pages.push({cv:pageReq(c,ch,i*18,i===chunks.length-1,pg++,total),name:'متطلبات العميل'}));
  c.sketches.forEach((s,i)=>pages.push({cv:pageSketch(c,s,pg++,total),name:'اسكتش: '+(s.piece||i+1)}));
  for(let i=0;i<nSite;i++)pages.push({cv:pageSite(c,c.plans[i]||null,roomRows.slice(i*7,i*7+7),pg++,total),name:'رفع المقاسات'+(c.plans[i]&&c.plans[i].title?': '+c.plans[i].title:'')});
  for(let i=0;i<nAtt;i++)pages.push({cv:pageAtt(c,imgs.slice(i*2,i*2+2),i===0?pdfs:[],pg++,total),name:'المرفقات'});
  return pages;
}

  if(imgs.length){const ty=pdfs.length?top+3:52;sec(x,ty,'الصور','PHOTOS');top=ty+3;
    const avail=275-top,slotH=(avail-6)/2;
    imgs.forEach((a,i)=>{const im=ATTIMG[a.id];const y0=top+i*(slotH+6);const bw=186,bh=slotH-6;
      rr(x,12,y0,bw,bh,2);x.fillStyle='#f7f4f0';x.fill();
      const s=Math.min(bw/im.naturalWidth,bh/im.naturalHeight);const w=im.naturalWidth*s,h=im.naturalHeight*s;
      x.save();rr(x,12,y0,bw,bh,2);x.clip();x.drawImage(im,12+(bw-w)/2,y0+(bh-h)/2,w,h);x.restore();
      txt(x,a.name,198,y0+bh+4.2,{pt:8.4,w:500,c:'#6d7a76',max:186})});}
  return cv;
}
let jspdfP=null;
function loadJsPdf(){if(window.jspdf)return Promise.resolve();if(jspdfP)return jspdfP;jspdfP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=JSPDF_SRC;s.onload=res;s.onerror=()=>{jspdfP=null;rej()};document.head.appendChild(s)});return jspdfP}
async function exportPdf(c){
  const ov=$('#ovroot');
  ov.innerHTML=`<div class="ov" role="dialog" aria-modal="true"><div class="ovc"><div class="ovh"><h2>تجهيز ملف PDF</h2><button class="btn line sm" data-ovclose>إغلاق</button></div><p class="note">جارٍ رسم الصفحات…</p></div></div>`;
  ov.querySelector('[data-ovclose]').onclick=()=>ov.innerHTML='';
  try{
    await Promise.all([document.fonts.load('400 20px Tajawal'),document.fonts.load('700 20px Tajawal'),document.fonts.load('800 20px Tajawal'),document.fonts.load('500 20px Tajawal')]).catch(()=>{});
    await loadLogo();
    for(const did of drawingIds(c))await ensureDrawing(c.id,did);
    await loadAttImages(c);
    const pages=buildPages(c);
    const imgs=pages.map(p=>p.cv.toDataURL('image/jpeg',.9));
    const fname=`${(c.name||'عميل').replace(/[\\/:*?"<>|]/g,'')} - النظرة الساحرة.pdf`;
    ov.innerHTML=`<div class="ov" role="dialog" aria-modal="true"><div class="ovc">
      <div class="ovh"><h2>${pages.length} صفحات جاهزة</h2><button class="btn pri" data-savepdf>حفظ PDF</button><button class="btn line" data-ovclose>إغلاق</button></div>
      <p class="note" id="ovnote">راجع الصفحات ثم اضغط «حفظ PDF». على الآيباد يفتح لك خيار الحفظ في الملفات أو المشاركة.</p>
      <div class="pages">${imgs.map((src,i)=>`<figure><img src="${src}" alt="${esc(pages[i].name)}"><figcaption>${i+1}. ${esc(pages[i].name)}</figcaption></figure>`).join('')}</div></div></div>`;
    ov.querySelector('[data-ovclose]').onclick=()=>ov.innerHTML='';
    let pdfBlob=null;
    const makeBlob=async()=>{if(pdfBlob)return pdfBlob;await loadJsPdf();const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});imgs.forEach((src,i)=>{if(i)pdf.addPage();pdf.addImage(src,'JPEG',0,0,210,297)});return pdfBlob=pdf.output('blob')};
    makeBlob().catch(()=>{});
    ov.querySelector('[data-savepdf]').onclick=async ev=>{
      const btn=ev.currentTarget,note=$('#ovnote');
      try{
        const dl=(store.mode==='db'&&window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
        if(dl){btn.disabled=true;const blob=await makeBlob();await dl.save({filename:fname,data:blob});note.textContent='تم تسليم الملف للحفظ.';btn.disabled=false;return}
        const blob=pdfBlob||await makeBlob();
        const file=new File([blob],fname,{type:'application/pdf'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fname});note.textContent='اختر «حفظ في الملفات» أو أرسل الملف لمن تريد.';return}
        const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=fname;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
        note.textContent='تم حفظ الملف في مجلد التنزيلات.';
      }catch(err){btn.disabled=false;
        if(err&&(err.name==='AbortError'||err.code==='declined')){note.textContent='تم إلغاء الحفظ.';return}
        console.error(err);note.textContent='تعذّر إنشاء الملف. حاول مرة ثانية.'}
    };
  }catch(err){console.error(err);ov.querySelector('.note').textContent='تعذّر تجهيز الصفحات. حاول مرة ثانية.'}
}

/* ---------- backup (local mode) ---------- */
const b2d=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function doBackup(){
  const el=$('#bk');if(el)el.textContent='جارٍ التجهيز…';
  try{const keys=await idb.keys();const data={};for(const k of keys){let v=await idb.get(k);if(v instanceof Blob)v={__blob:await b2d(v)};data[k]=v}
    const json=JSON.stringify({app:'magiclook-clients',v:1,at:new Date().toISOString(),data});
    const fname=`نسخة احتياطية - ملفات العملاء ${today()}.json`;const file=new File([json],fname,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fname})}
    else{const u=URL.createObjectURL(file);const l=document.createElement('a');l.href=u;l.download=fname;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
    if(el)el.textContent='تم تجهيز النسخة الاحتياطية.';
  }catch(e){if(el)el.textContent=e&&e.name==='AbortError'?'':'تعذّر حفظ النسخة.'}
}
async function doRestore(f){
  const el=$('#bk');try{const j=JSON.parse(await f.text());if(j.app!=='magiclook-clients')throw 0;
    for(const[k,v]of Object.entries(j.data)){let val=v;if(v&&v.__blob){val=await(await fetch(v.__blob)).blob()}await idb.set(k,val)}
    S.clients=(await store.list()).map(c=>(c.attachments=c.attachments||[],c));S.draw={};render();toast(`تمت استعادة ${S.clients.length} ملف عميل`);
  }catch(e){if(el)el.textContent='الملف غير صالح. اختر ملف نسخة احتياطية من هذا التطبيق.'}
}

/* ---------- file picking ---------- */
document.body.insertAdjacentHTML('beforeend','<input type="file" id="filepick" accept="image/*,application/pdf,.pdf,.heic" multiple hidden>');
document.body.insertAdjacentHTML('beforeend','<input type="file" id="restorepick" accept="application/json,.json" hidden>');
$('#restorepick').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)doRestore(f)});
$('#filepick').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';addFiles(fs)});
document.addEventListener('dragover',e=>{if(cur()&&e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();$('#drop')?.classList.add('over')}});
document.addEventListener('dragleave',e=>{if(e.target.id==='drop')e.target.classList.remove('over')});
document.addEventListener('drop',e=>{if(!cur()||!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();$('#drop')?.classList.remove('over');addFiles([...e.dataTransfer.files])});
document.addEventListener('paste',e=>{if(!cur())return;const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();addFiles(fs)}});

/* ---------- boot ---------- */
async function boot(){
  render();
  let db=null,user=null;
  if(window.claude&&window.claude.use){
    try{const r=await Promise.race([Promise.all([window.claude.use('db'),window.claude.use('user')]),new Promise(r=>setTimeout(()=>r([null,null]),10000))]);db=r[0];user=r[1]}catch(e){}
  }
  if(db&&user){try{store.uid=await user.id();store.db=db;store.mode='db'}catch(e){}}
  if(store.mode!=='db'){store.mode='local';try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
  try{S.clients=(await store.list()).map(c=>(c.attachments=c.attachments||[],c))}catch(e){console.warn(e);if(store.mode==='db'){store.mode='local';S.clients=await store.list()}}
  S.loading=false;setStatus('',savedText());
  if(!S.cur)render();
}
boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
